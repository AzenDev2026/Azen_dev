# ---------- 核心模式 ----------
# energy-saver | balanced | performance
SYSTEM_MODE=balanced

# ---------- 应用冰封 ----------
ENABLE_APP_NAP=true
SCAN_INTERVAL=5
FREEZE_TIMEOUT=3600
CPU_THRESHOLD=5

# ---------- 白名单 ----------
WHITELIST_APPS=terminal,spotify,transmission,clash,v2ray,alrm

# ---------- 睡眠 ----------
AUTO_SLEEP_MODE=true